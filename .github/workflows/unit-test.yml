name: Unit Tests

on:
  push:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-18.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v2
    - name: "Install Java 8"
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
    - name: Run Unit Tests
      env:
        PROFILE: ${{ secrets.PROFILE }}
      run: |
        echo $PROFILE > profile.json
        mvn test
    - name: Code Coverage
      uses: codecov/codecov-action@v1

